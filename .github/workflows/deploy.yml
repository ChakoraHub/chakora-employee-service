name: Deploy Employee Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: employee-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # LEVEL 1: ENABLE MAINTENANCE MODE
  # ============================================================================
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest

    steps:
      - name: Enable maintenance through Employee Resources
        env:
          MAINTENANCE_ON_URL: ${{ secrets.EMPLOYEE_RESOURCES_MAINTENANCE_ON_URL }}
          GENERIC_MAINTENANCE_ON_URL: ${{ secrets.MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          TARGET_URL="${MAINTENANCE_ON_URL:-$GENERIC_MAINTENANCE_ON_URL}"
          TARGET_URL=$(echo "$TARGET_URL" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          MAINTENANCE_TOKEN=$(echo "$MAINTENANCE_TOKEN" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          echo "[maintenance:on] Starting maintenance enable request"
          if [ -z "$TARGET_URL" ]; then
            echo "[maintenance:on] Warning: Neither EMPLOYEE_RESOURCES_MAINTENANCE_ON_URL nor MAINTENANCE_ON_URL is configured. Skipping API call."
            exit 0
          fi

          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:on] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:on] MAINTENANCE_TOKEN is empty"
          fi

          echo "[maintenance:on] Endpoint is configured: $TARGET_URL"
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-on-response.txt \
            --dump-header maintenance-on-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$TARGET_URL" || true)

          echo "[maintenance:on] HTTP status: $status"
          echo "[maintenance:on] Response body:"
          cat maintenance-on-response.txt || true
          echo

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "[maintenance:on] Maintenance enabled successfully"
          else
            echo "[maintenance:on] Warning: Service endpoint returned $status prior to deployment. Proceeding with deployment to start/restart PM2..."
          fi

  # ============================================================================
  # LEVEL 2: DEPLOY TO EC2
  # ============================================================================
  deploy:
    name: Deploy Employee to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance

    steps:
      - name: SSH and deploy to EC2
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            echo "Working directory: $(pwd)"

            echo "Fetching latest main branch..."
            if [ ! -e .git ]; then
              git init
            fi
            git fetch https://github.com/ChakoraHub/chakora-employee-service.git main
            git checkout -f -B main FETCH_HEAD

            echo "Setting up Python environment..."
            # Check if employee-venv or venv exists and has a working python -m pip
            if [ -d "employee-venv" ]; then
              if ! ./employee-venv/bin/python -m pip --version >/dev/null 2>&1; then
                echo "Existing employee-venv is broken or stale. Recreating..."
                rm -rf employee-venv
              fi
            elif [ -d "venv" ]; then
              if ! ./venv/bin/python -m pip --version >/dev/null 2>&1; then
                echo "Existing venv is broken or stale. Recreating..."
                rm -rf venv
              fi
            fi

            if [ ! -d "employee-venv" ] && [ ! -d "venv" ]; then
              echo "Creating fresh employee-venv virtual environment..."
              python3 -m venv employee-venv || python -m venv employee-venv
            fi

            echo "Installing Python dependencies..."
            if [ -f "./employee-venv/bin/python" ]; then
              ./employee-venv/bin/python -m pip install --upgrade pip setuptools wheel || true
              ./employee-venv/bin/python -m pip install -r requirements.txt
            elif [ -f "./venv/bin/python" ]; then
              ./venv/bin/python -m pip install --upgrade pip setuptools wheel || true
              ./venv/bin/python -m pip install -r requirements.txt
            else
              pip install -r requirements.txt || true
            fi

            echo "Restarting PM2 application..."
            SERVICE_NAME="${{ secrets.PM2_SERVICE_NAME }}"
            if [ -z "$SERVICE_NAME" ]; then
              SERVICE_NAME="employee-service"
            fi
            if [ -x "./employee-venv/bin/uvicorn" ]; then
              pm2 restart "$SERVICE_NAME" || pm2 start "./employee-venv/bin/uvicorn employee_service:app --host 0.0.0.0 --port 8002" --name "$SERVICE_NAME"
            elif [ -x "./venv/bin/uvicorn" ]; then
              pm2 restart "$SERVICE_NAME" || pm2 start "./venv/bin/uvicorn employee_service:app --host 0.0.0.0 --port 8002" --name "$SERVICE_NAME"
            else
              pm2 restart "$SERVICE_NAME" || pm2 start "uvicorn employee_service:app --host 0.0.0.0 --port 8002" --name "$SERVICE_NAME"
            fi
            pm2 save

            echo "Deployment commands completed successfully."

  # ============================================================================
  # LEVEL 3: SELENIUM SMOKE TESTS
  # ============================================================================
  selenium-smoke-tests:
    name: Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: "latest"
          install-chromedriver: false

      - name: Configure Chrome and driver environment
        run: |
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "$CHROME_PATH" ] && [ -f "$CHROME_PATH" ]; then
            sudo ln -fs "$CHROME_PATH" /usr/bin/google-chrome || true
            sudo ln -fs "$CHROME_PATH" /usr/bin/chrome || true
          fi
          # Remove mismatched chromedrivers so Selenium Manager automatically gets matching driver
          sudo rm -rf /opt/hostedtoolcache/setup-chrome/chromedriver || true
          sudo rm -f /usr/local/bin/chromedriver /usr/bin/chromedriver || true

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip==25.0.1
          python -m pip install --only-binary :all: selenium==4.29.0 pytest==8.3.5 requests==2.32.3

      - name: Wait for deployed Employee service
        env:
          EMPLOYEE_BASE_URL: https://www.chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 10 "$EMPLOYEE_BASE_URL/emp-leave" > /dev/null; then
              echo "Deployed Employee leave page is responding."
              exit 0
            fi
            echo "Employee page not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Deployed Employee page did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          EMPLOYEE_BASE_URL: https://www.chakorahub.com
        run: |
          pytest -v employee_smoke.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  # ============================================================================
  # LEVEL 4: DISABLE MAINTENANCE MODE (Runs only if Selenium passes)
  # ============================================================================
  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}

    steps:
      - name: Disable maintenance through Employee Resources
        env:
          MAINTENANCE_OFF_URL: ${{ secrets.EMPLOYEE_RESOURCES_MAINTENANCE_OFF_URL }}
          GENERIC_MAINTENANCE_OFF_URL: ${{ secrets.MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          TARGET_URL="${MAINTENANCE_OFF_URL:-$GENERIC_MAINTENANCE_OFF_URL}"
          TARGET_URL=$(echo "$TARGET_URL" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          MAINTENANCE_TOKEN=$(echo "$MAINTENANCE_TOKEN" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          echo "[maintenance:off] Starting maintenance disable request"
          if [ -z "$TARGET_URL" ]; then
            echo "[maintenance:off] Warning: Neither EMPLOYEE_RESOURCES_MAINTENANCE_OFF_URL nor MAINTENANCE_OFF_URL is configured. Skipping API call."
            exit 0
          fi

          echo "[maintenance:off] Endpoint is configured: $TARGET_URL"
          status=$(curl --silent --show-error --location-trusted --post301 --post302 --post303 --max-time 20 \
            --output maintenance-off-response.txt \
            --dump-header maintenance-off-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$TARGET_URL" || true)

          echo "[maintenance:off] HTTP status: $status"
          echo "[maintenance:off] Response body:"
          cat maintenance-off-response.txt || true
          echo

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "[maintenance:off] Maintenance disabled successfully via API"
          else
            echo "[maintenance:off] Warning: API returned status $status. Proceeding to direct SSH flag removal."
          fi

      - name: SSH Direct Cleanup on EC2
        if: always()
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            rm -f /home/ec2-user/employee-maintenance.flag /tmp/employee-maintenance.flag "${{ secrets.APP_PATH }}/employee-maintenance.flag" || true
            echo "Direct SSH maintenance flag cleanup completed."
